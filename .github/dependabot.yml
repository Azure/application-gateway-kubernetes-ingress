version: 2
updates:
- package-ecosystem: "docker"
  directory: "/"
  schedule:
    interval: "daily"
- package-ecosystem: "gomod"
  directory: "/"
  schedule:
    interval: "daily"
- package-ecosystem: "github-actions"
  directory: "/"
  groups:
    github-actions:
      patterns: ["*"]
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
