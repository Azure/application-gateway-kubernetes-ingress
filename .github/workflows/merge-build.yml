name: "Merge Build"

on:
  push:
    branches:
    - master
    - release/*
  pull_request:
    branches:
    - master
    - release/*
permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Go workspace
      run: |
        shopt -s extglob
        shopt -s dotglob
      shell: bash
    - name: Install Helm
      uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
      with:
        version: v3.11.0
    - name: Get Go version from Makefile
      id: go-version
      run: |
        GO_VERSION=$(make -s print-go-version)
        if [ -z "$GO_VERSION" ]; then echo "Failed to get Go version" && exit 1; fi
        echo "version=$GO_VERSION" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
      with:
        go-version: "${{ steps.go-version.outputs.version }}"
    - name: Go and Helm lint check
      run: make lint-all
    - name: Go vet
      run: make vet-all
    - name: Get dependencies and build
      run: make build
    - name: Run unit tests with code coverage
      run: make unittest
    - name: Publish test results
      if: always()
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
      with:
        name: test-results
        path: ${{ github.workspace }}/**/report.xml
    - name: Publish code coverage results
      if: always()
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
      with:
        name: code-coverage
        path: coverage.xml